services:
  gateway:
    environment:
      DFS_GATEWAY_TLS_CERT: ""
      DFS_GATEWAY_TLS_KEY: ""
      DFS_GATEWAY_TLS_TERMINATED: "1"
    ports: !reset []
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      DFS_PUBLIC_HOST: ${DFS_PUBLIC_HOST:?set the public domain in Deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [dfsha]

volumes:
  caddy-data:
  caddy-config:
