services:
  node:
    build:
      context: ..
    command: ["python", "-m", "Node.server"]
    restart: unless-stopped
    environment:
      DFS_NODE_BIND: 0.0.0.0
      DFS_NODE_PORT: "50051"
      DFS_NODE_ID: ${DFS_NODE_ID:?set this node private IP followed by :50051}
      DFS_NODE_TLS_CERT: /run/certs/nodes.crt
      DFS_NODE_TLS_KEY: /run/certs/nodes.key
      DFS_NODE_TLS_CA: /run/certs/ca.crt
      DFS_NODE_TLS_REQUIRED: "1"
      DFS_NODE_TLS_SERVER_NAME: node1
      DFS_NODE_PEER_TIMEOUT: "10"
      DFS_NODE_TOKEN: ${DFS_NODE_TOKEN:?set the shared internal token in Deploy/.env}
      DFS_STORAGE_KEY: ${DFS_STORAGE_KEY:?set a unique base64 AES-256 key in Deploy/.env}
      DFS_NODE_STORAGE: /var/lib/dfsha
    ports:
      - "50051:50051"
    volumes:
      - node-data:/var/lib/dfsha
      - ./certs:/run/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  node-data:
