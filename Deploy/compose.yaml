services:
  node1:
    build:
      context: ..
    command: ["python", "-m", "Node.server"]
    restart: unless-stopped
    environment: &node_environment
      DFS_NODE_BIND: 0.0.0.0
      DFS_NODE_TLS_CERT: /run/certs/nodes.crt
      DFS_NODE_TLS_KEY: /run/certs/nodes.key
      DFS_NODE_TOKEN: ${DFS_NODE_TOKEN:?set DFS_NODE_TOKEN in Deploy/.env}
      DFS_STORAGE_KEY: ${DFS_NODE1_STORAGE_KEY:?set a unique 32-byte key in Deploy/.env}
      DFS_NODE_STORAGE: /var/lib/dfsha
      DFS_NODE_PORT: "50051"
    volumes:
      - node1-data:/var/lib/dfsha
      - ./certs:/run/certs:ro
    networks: [dfsha]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5

  node2:
    build:
      context: ..
    command: ["python", "-m", "Node.server"]
    restart: unless-stopped
    environment:
      <<: *node_environment
      DFS_STORAGE_KEY: ${DFS_NODE2_STORAGE_KEY:?set a unique 32-byte key in Deploy/.env}
      DFS_NODE_PORT: "50052"
    volumes:
      - node2-data:/var/lib/dfsha
      - ./certs:/run/certs:ro
    networks: [dfsha]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50052), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5

  node3:
    build:
      context: ..
    command: ["python", "-m", "Node.server"]
    restart: unless-stopped
    environment:
      <<: *node_environment
      DFS_STORAGE_KEY: ${DFS_NODE3_STORAGE_KEY:?set a unique 32-byte key in Deploy/.env}
      DFS_NODE_PORT: "50053"
    volumes:
      - node3-data:/var/lib/dfsha
      - ./certs:/run/certs:ro
    networks: [dfsha]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50053), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: ..
    command: ["python", "-m", "Gateway.app"]
    restart: unless-stopped
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
    environment:
      DFS_GATEWAY_BIND: 0.0.0.0
      DFS_GATEWAY_PORT: "8000"
      DFS_GATEWAY_TLS_CERT: /run/certs/gateway.crt
      DFS_GATEWAY_TLS_KEY: /run/certs/gateway.key
      DFS_USERS: ${DFS_USERS:-}
      DFS_USER_PASSWORDS: ${DFS_USER_PASSWORDS:?set initial user passwords in Deploy/.env}
      DFS_USER_ROLES: ${DFS_USER_ROLES:-{"admin":"admin","demo":"usuario"}}
      DFS_AUTH_USERS_FILE: ${DFS_AUTH_USERS_FILE:-/app/metadata/usuarios.json}
      DFS_ADMIN_TOKEN: ${DFS_ADMIN_TOKEN:?set an admin token in Deploy/.env}
      DFS_NODE_TOKEN: ${DFS_NODE_TOKEN:?set DFS_NODE_TOKEN in Deploy/.env}
      DFS_NODE_TLS_CA: /run/certs/ca.crt
      DFS_NODE_TLS_REQUIRED: "1"
      DFS_NODES: node1:50051,node2:50052,node3:50053
      DFS_REPLICATION_FACTOR: "3"
      DFS_READ_QUORUM: "2"
      DFS_WRITE_QUORUM: "2"
      DFS_BLOCK_SIZE: "67108864"
      DFS_MAX_UPLOAD_BYTES: "1073741824"
    ports:
      - "8443:8000"
    volumes:
      - gateway-metadata:/app/metadata
      - ./certs:/run/certs:ro
    networks: [dfsha]
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://127.0.0.1:8000/health', context=ssl._create_unverified_context(), timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  dfsha:
    driver: bridge

volumes:
  node1-data:
  node2-data:
  node3-data:
  gateway-metadata:
