syntax = "proto3";

package dfsha;
option java_package = "dfsha";
option java_multiple_files = true;


// Aqui se define el servicio gRPC encargado de las operaciones sobre bloques, la logoca pero no se si esta buena

service BloqueServicio {

    rpc EscribirBloque(EscribirBloqueRequest) returns (EscribirBloqueResponse);

    // El nodo coordinador escribe localmente y propaga el bloque a sus réplicas.
    rpc ReplicarBloque(ReplicarBloqueRequest) returns (ReplicarBloqueResponse);

    rpc LeerBloque(LeerBloqueRequest) returns (LeerBloqueResponse);

    rpc EliminarBloque(EliminarBloqueRequest) returns (EliminarBloqueResponse);

    // Heartbeat de aplicación para identidad, disponibilidad y capacidad local.
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

    // Difunde la vista de membresía vigente a todos los nodos alcanzables.
    rpc ActualizarMembresia(ActualizarMembresiaRequest) returns (ActualizarMembresiaResponse);
}

message HeartbeatRequest {
    string requester_id = 1;
}

message HeartbeatResponse {
    bool exito = 1;
    string node_id = 2;
    string estado = 3;
    int64 last_heartbeat_unix_ms = 4;
    int64 capacidad_disponible_bytes = 5;
}

message NodoMembresia {
    string node_id = 1;
    string direccion = 2;
    int32 puerto = 3;
    string estado = 4;
    string hash_position = 5;
    string last_heartbeat = 6;
    int64 capacidad_disponible_bytes = 7;
}

message ActualizarMembresiaRequest {
    repeated NodoMembresia nodos = 1;
}

message ActualizarMembresiaResponse {
    bool exito = 1;
    uint32 miembros = 2;
}


// Define los datos que deben enviarse para escribir un bloque.
message EscribirBloqueRequest {

    string block_id = 1;

    // Identificador del archivo al que pertenece el bloque.
    string file_id = 2;

    // Posición que ocupa el bloque dentro del archivo original.
    int32 posicion = 3;

    // bytes permite transportar directamente los datos del archivo.
    bytes contenido = 4;

    // Valor utilizado para verificar la integridad del bloque.
    string checksum = 5;
}


// Aqui se define la información que devuelve el servicio,  después de intentar escribir un bloque.
message EscribirBloqueResponse {

    // Indica si la operación de escritura fue exitosa, true correcto y false que fallo 
    bool exito = 1;

    // Mensaje descriptivo sobre el resultado de la operación.
    string mensaje = 2;

    // Identificador del bloque relacionado con la operación.
    string block_id = 3;
}

message ReplicarBloqueRequest {
    string block_id = 1;
    string file_id = 2;
    int32 posicion = 3;
    bytes contenido = 4;
    string checksum = 5;
    repeated string destinos = 6;
}

message ReplicarBloqueResponse {
    bool exito = 1;
    uint32 replicas_confirmadas = 2;
    string mensaje = 3;
}


// Define los datos necesarios para solicitar la lectura de un bloque.
message LeerBloqueRequest {

    // Identificador del bloque que se desea recuperar.
    string block_id = 1;
}


// Define la información que devuelve el servicio después de intentar leer un bloque.
message LeerBloqueResponse {

    // Indica si la operación de lectura fue exitosa.
    bool exito = 1;

    // Mensaje descriptivo sobre el resultado de la operación.
    string mensaje = 2;

    // Identificador del bloque recuperado.
    string block_id = 3;

    // Identificador del archivo al que pertenece el bloque.
    string file_id = 4;

    // Posición del bloque dentro del archivo original.
    int32 posicion = 5;

    // Contenido binario del bloque recuperado.
    bytes contenido = 6;

    // Checksum utilizado para verificar la integridad del bloque recuperado.
    string checksum = 7;
}


// Aqui es para pedir ñps datos para la eliminación de un bloque.
message EliminarBloqueRequest {

    // Identificador del bloque que se va a eliminar.
    string block_id = 1;
}


// Define la información que devuelve el servicio después de intentar eliminar un bloque.
message EliminarBloqueResponse {

    // Indica si la eliminación fue exitosa.
    bool exito = 1;

    // Mensaje descriptivo sobre el resultado de la operación.
    string mensaje = 2;
}
